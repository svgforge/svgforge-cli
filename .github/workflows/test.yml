name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_COLOR: 2

permissions:
  contents: read

jobs:
  test:
    name: Node 24 on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          cache: true
          require-lockfile: true

      - name: Reject local link overrides
        run: |
          if grep -R "link:" pnpm-workspace.yaml pnpm-lock.yaml 2>/dev/null; then
            echo "::error::pnpm-workspace.yaml/pnpm-lock.yaml contain a local link: override." >&2
            exit 1
          fi
          echo "No link: override found — lockfile resolves from the registry."

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run Coveralls
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: coverage/lcov.info
          github-token: "${{ secrets.GITHUB_TOKEN }}"
