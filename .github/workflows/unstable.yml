name: Unstable build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 2
  NODE: 24 # The Node.js version to publish from

jobs:
  publish:
    name: Publish unstable build to npm
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12
          runtime: node@${{ env.NODE }}
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Determine unstable version
        run: |
          BASE=$(node -e "var v=require('./package.json').version.split('-')[0].split('.'); v[2]=String(Number(v[2])+1); console.log(v.join('.'))")
          SHA=$(git rev-parse --short HEAD)
          npm pkg set version="${BASE}-unstable.$(date +%Y%m%d%H%M).${SHA}"

      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Publish to npm (unstable tag)
        run: pnpm publish --no-git-checks --tag next --access public