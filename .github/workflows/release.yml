name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE: 24 # The Node.js version to publish from

permissions:
  contents: write
  packages: write # Publish to GitHub Packages

jobs:
  publish:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12
          runtime: node@${{ env.NODE }}
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json has $PACKAGE_VERSION, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public

      - name: Configure GitHub Packages authentication
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" >> ~/.npmrc
          echo "@svgforge:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks --access public --registry=https://npm.pkg.github.com

      - name: Create GitHub release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " {flag = 1; print; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            echo "No CHANGELOG section for v$VERSION — using generated notes." >&2
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi